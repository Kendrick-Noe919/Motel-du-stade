<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Le « M » du Motel du Stade, sur le dégradé vert de la charte.
    Reprend exactement le bloc affiché dans la barre latérale et sur l'écran de
    connexion : l'onglet du navigateur doit se reconnaître d'un coup d'œil parmi
    vingt autres.
  -->
  <defs>
    <linearGradient id="vert" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#vert)"/>

  <!-- Lettre tracée en chemin plutôt qu'en <text> : une police absente du poste
       ferait apparaître un M dans une graisse quelconque, voire rien du tout. -->
  <path d="M16 45V19h6.6l9.4 15.2L41.4 19H48v26h-6.3V30.6l-7.3 11.6h-3.8l-7.3-11.6V45z"
        fill="#FFFFFF"/>
</svg>
